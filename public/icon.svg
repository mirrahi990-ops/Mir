<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Ultrasonic Radar Arcs at top -->
  <path d="M 176 130 A 100 100 0 0 1 336 130" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.4" />
  <path d="M 206 160 A 60 60 0 0 1 306 160" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.8" />
  <circle cx="256" cy="180" r="10" fill="#38bdf8" filter="url(#glow)" />

  <!-- Water Drop in Center -->
  <path d="M 256 195 C 256 195, 140 325, 140 380 C 140 445, 192 475, 256 475 C 320 475, 372 445, 372 380 C 372 325, 256 195, 256 195 Z" fill="url(#waterGrad)" filter="url(#glow)" />

  <!-- Wave lines inside drop -->
  <path d="M 160 380 C 190 365, 230 395, 270 380 C 310 365, 340 385, 355 380 C 352 425, 315 455, 256 455 C 197 455, 162 425, 160 380 Z" fill="#0369a1" opacity="0.6" />

  <!-- Highlight glare on drop -->
  <path d="M 200 310 C 180 340, 180 375, 185 390 C 180 375, 185 330, 215 295 C 225 285, 240 265, 245 255 C 235 275, 210 295, 200 310 Z" fill="#ffffff" opacity="0.45" />

  <!-- Bluetooth Symbol Inside Drop -->
  <g transform="translate(256, 360) scale(1.15)" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M -8 -15 L 8 0 L -8 15 L -8 -15 L 8 0 L -8 -15 M 0 -22 L 0 22 M 0 -22 L 10 -11 L 0 0 L 10 11 L 0 22" />
  </g>
</svg>
